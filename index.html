<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Merit Extra | Coming Soon</title>
<meta name="theme-color" content="#000000">
<meta name="description" content="Merit Extra. Coming soon. Energy Management Services.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --ink: #eaf9ff;
    --cyan: #9ceaff;
    --muted: #8795aa;
    --font: "Sora", "Helvetica Neue", Helvetica, Arial, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); }
  body {
    height: 100%;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    font-family: var(--font);
    color: var(--ink);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  /* Globe: still layer (rim, glow) under a live layer (coastlines, grid, current, arcs) */
  #still, #globe {
    position: fixed;
    z-index: 0;
    opacity: 0;
    pointer-events: none;
    animation: fade 3.2s ease-out 0.3s forwards;
  }

  .shade {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(ellipse 30% 20% at 50% 46%, rgba(0,0,0,0.7), rgba(0,0,0,0) 80%);
  }

  main {
    position: relative;
    z-index: 2;
    flex: 1;
    display: grid;
    place-items: center;
  }
  .stage {
    position: relative;
    display: grid;
    justify-items: center;
    gap: clamp(10px, 2.2vmin, 30px);
  }

  .glow {
    position: absolute;
    inset: 0;
    margin: auto;
    width: min(46vmin, 560px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(61,150,255,0.16), rgba(61,150,255,0) 62%);
    filter: blur(40px);
    opacity: 0;
    animation: fade 4s ease-out 0.8s forwards;
  }

  /* Both lines fade up out of the dark once, then stay completely still */
  h1 {
    position: relative;
    font-weight: 200;
    font-size: clamp(2rem, 8.4vmin, 7.4rem);
    line-height: 1.05;
    letter-spacing: 0.04em;
    text-align: center;
    white-space: nowrap;
    background: linear-gradient(100deg, #ffffff 0%, #eaf9ff 38%, #9ceaff 70%, #86b2ff 100%);
    -webkit-background-clip: text;
            background-clip: text;
    -webkit-text-fill-color: transparent;
            color: transparent;
    opacity: 0;
    animation: powerOn 3.6s ease-out 0.8s forwards;
  }
  h1::after {
    content: attr(data-text);
    position: absolute;
    inset: 0;
    z-index: -1;
    background: inherit;
    -webkit-background-clip: text;
            background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: blur(22px);
    opacity: 0.55;
  }
  .sub {
    position: relative;
    font-weight: 300;
    font-size: clamp(0.9rem, 2.7vmin, 2.3rem);
    letter-spacing: 0.38em;
    text-indent: 0.38em;
    text-align: center;
    white-space: nowrap;
    color: var(--cyan);
    text-shadow: 0 0 20px rgba(77,190,255,0.45);
    opacity: 0;
    animation: fade 2.4s ease-out 2.8s forwards;
  }

  footer {
    position: relative;
    z-index: 2;
    display: grid;
    justify-items: center;
    gap: clamp(14px, 2.4vmin, 30px);
    padding-bottom: calc(clamp(28px, 5vmin, 72px) + env(safe-area-inset-bottom, 0px));
    opacity: 0;
    animation: fade 2.4s ease-out 3.6s forwards;
  }
  .line {
    width: min(26vmin, 360px);
    min-width: 160px;
    height: 1px;
    background: linear-gradient(90deg, rgba(77,190,255,0), #5fd0ff, #6f9bff, rgba(111,155,255,0));
    box-shadow: 0 0 14px rgba(77,190,255,0.45);
  }
  footer p {
    font-weight: 300;
    font-size: clamp(0.82rem, 2.1vmin, 1.7rem);
    letter-spacing: 0.22em;
    color: var(--muted);
    text-align: center;
    text-indent: 0.22em;
  }

  @keyframes fade { to { opacity: 1; } }
  @keyframes powerOn {
    0%   { opacity: 0;    filter: blur(18px); letter-spacing: 0.1em; }
    16%  { opacity: 0.32; }
    22%  { opacity: 0.06; }
    36%  { opacity: 0.55; }
    42%  { opacity: 0.22; }
    60%  { opacity: 0.82; filter: blur(5px); }
    68%  { opacity: 0.6; }
    100% { opacity: 1;    filter: blur(0);   letter-spacing: 0.04em; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-delay: 0s !important; }
  }
</style>
</head>
<body>
<canvas id="still" aria-hidden="true"></canvas>
<canvas id="globe" aria-hidden="true"></canvas>
<div class="shade" aria-hidden="true"></div>

<main>
  <div class="stage">
    <div class="glow" aria-hidden="true"></div>
    <h1 data-text="Merit Extra">Merit Extra</h1>
    <p class="sub">Coming Soon</p>
  </div>
</main>

<footer>
  <div class="line" aria-hidden="true"></div>
  <p>Energy Management Services</p>
</footer>

    o.brk = new Uint8Array(n);   // edges that only trace the map seam or the pole are not drawn
    for (i = 0; i < n; i++) {

    }

  });

  /* faint graticule: a line every 20 degrees */
  var LATS = [-60, -40, -20, 0, 20, 40, 60], grat = [], i, k, lo, la;
  for (i = 0; i < 18; i++) {
    lo = []; la = [];
    for (k = -80; k <= 80; k += 5) { lo.push(i * 20 - 180); la.push(k); }
    grat.push(makeLine(lo, la, false));
  }
  LATS.forEach(function (lat) {
    lo = []; la = [];
    for (k = 0; k <= 360; k += 5) { lo.push(k - 180); la.push(lat); }

  (function () {

    x = c.getContext('2d');
    x.fillStyle = '#fff';
    x.beginPath();
    rawRings.forEach(function (r) {
      r.forEach(function (p, n) {
        var px = (p[0] / 10 + 180) * 4, py = (90 - p[1] / 10) * 4;
        if (n) x.lineTo(px, py); else x.moveTo(px, py);

    });

    x.beginPath();
    [[46.8, 44.6], [47.6, 45.6], [49.2, 46.6], [51.0, 47.0], [53.0, 46.8], [53.2, 45.4], [51.4, 44.8], [50.6, 44.6], [51.0, 43.0],
     [52.7, 41.6], [53.0, 40.2], [53.8, 39.2], [53.9, 37.4], [53.0, 36.8], [50.8, 36.9], [49.4, 37.5], [49.0, 38.6], [49.4, 40.2],
     [50.6, 40.4], [49.6, 41.0], [48.8, 41.8], [47.6, 43.0], [47.2, 44.0]].forEach(function (p, n) {
      var px = (p[0] + 180) * 4, py = (90 - p[1]) * 4;

  })();
  function isLand(lon, lat) {
    var l = ((lon + 180) % 360 + 360) % 360, xi = Math.min(MW - 1, Math.floor(l * 4)), yi = Math.max(0, Math.min(MH - 1, Math.floor((90 - lat) * 4)));

  /* the grid: nodes only on land, joined to near neighbours across land */
  var nodes = [], edges = [], STEP = 6.5;
  (function () {
    var lat, row = 0, nl, kk, lon, jl, n, m, a, b, dot, cmin = Math.cos(STEP * 1.5 * D2R), dl, t, ok, len, keep = [];

        jl = lat + (Math.random() - 0.5) * 2;
        if (!isLand(lon, jl)) continue;
        n = { lon: lon * D2R, lat: jl * D2R, adj: [], flash: 0, sx: 0, sy: 0, z: -1 };
        n.u = [Math.cos(n.lat) * Math.cos(n.lon), Math.cos(n.lat) * Math.sin(n.lon), Math.sin(n.lat)];

      for (m = n + 1; m < nodes.length; m++) {

  })();

  var cv = document.getElementById('globe');
  var ctx = cv.getContext('2d');
  var bg = document.getElementById('still');
  var bctx = bg.getContext('2d');
  var stage = document.querySelector('.stage');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var w = 0, h = 0, dpr = 1, s = 1, bs = 1, R = 300, C = 400;
  var rot = -20 * D2R, sph = Math.sin(TILT), cph = Math.cos(TILT);
  var runners = [], arcs = [], nextArc = 0, last = 0;

  function rnd(a, b) { return a + Math.random() * (b - a); }

  function build() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    s = Math.max(0.8, Math.min(2.4, Math.min(w, h) / 800));
    var st = stage.getBoundingClientRect();
    var cx0 = st.left + st.width / 2, cy0 = st.top + st.height / 2;
    R = Math.min(w * 0.44, h * 0.37);
    var pad = 70 * s, side = Math.ceil(2 * R + 2 * pad);
    C = side / 2;
    [cv, bg].forEach(function (c) {
      c.style.width = side + 'px';
      c.style.height = side + 'px';
      c.style.left = Math.round(cx0 - side / 2) + 'px';
      c.style.top = Math.round(cy0 - side / 2) + 'px';
    });
    var bsStill = Math.min(dpr, Math.sqrt(4e6) / side);
    bs = Math.min(dpr, Math.sqrt(2.4e6) / side);
    bg.width = Math.round(side * bsStill); bg.height = Math.round(side * bsStill);
    cv.width = Math.round(side * bs); cv.height = Math.round(side * bs);
    ctx.setTransform(bs, 0, 0, bs, 0, 0);
    bctx.setTransform(bsStill, 0, 0, bsStill, 0, 0);

    /* still layer: faint body, inner rim light, neon outline */
    bctx.clearRect(0, 0, side, side);
    var g = bctx.createRadialGradient(C - 0.28 * R, C - 0.32 * R, 0.1 * R, C, C, R);
    g.addColorStop(0, 'rgba(40,110,220,0.10)');
    g.addColorStop(0.7, 'rgba(20,70,170,0.05)');
    g.addColorStop(1, 'rgba(60,150,255,0.16)');
    bctx.fillStyle = g;
    bctx.beginPath(); bctx.arc(C, C, R, 0, TAU); bctx.fill();
    bctx.save();
    bctx.beginPath(); bctx.arc(C, C, R, 0, TAU); bctx.clip();
    [[46, 0.035], [26, 0.05], [13, 0.07]].forEach(function (q) {
      bctx.lineWidth = q[0] * s; bctx.strokeStyle = 'rgba(40,120,255,' + q[1] + ')';
      bctx.beginPath(); bctx.arc(C, C, R, 0, TAU); bctx.stroke();
    });
    bctx.restore();
    bctx.globalCompositeOperation = 'lighter';
    [[34, 0.035], [20, 0.055], [11, 0.10], [5.5, 0.18]].forEach(function (q) {
      bctx.lineWidth = q[0] * s; bctx.strokeStyle = 'rgba(50,150,255,' + q[1] + ')';
      bctx.beginPath(); bctx.arc(C, C, R, 0, TAU); bctx.stroke();
    });
    bctx.lineWidth = 2.2 * s; bctx.strokeStyle = 'rgba(110,210,255,0.85)';
    bctx.beginPath(); bctx.arc(C, C, R, 0, TAU); bctx.stroke();
    bctx.lineWidth = 0.9 * s; bctx.strokeStyle = 'rgba(235,250,255,0.95)';
    bctx.beginPath(); bctx.arc(C, C, R, 0, TAU); bctx.stroke();
    bctx.globalCompositeOperation = 'source-over';

    runners = []; arcs = [];
    nextArc = performance.now() + 4200;
    if (reduce) draw(0);
  }

  /* spin every point to the current view */
  function spin(o) {
    var i, dl, cd, sd;
    for (i = 0; i < o.n; i++) {
      dl = o.lon[i] - rot; cd = Math.cos(dl); sd = Math.sin(dl);
      o.X[i] = o.cl[i] * sd;
      o.Y[i] = cph * o.sl[i] - sph * o.cl[i] * cd;
      o.Z[i] = sph * o.sl[i] + cph * o.cl[i] * cd;
    }
  }

  /* add the visible stretches of a line to the current path, cut cleanly at the horizon */
  function runs(o) {
    var last = o.closed ? o.n : o.n - 1, i, j, p, pv = false, t, xi, yi, l, X = o.X, Y = o.Y, Z = o.Z;
    for (i = 0; i <= last; i++) {
      j = i % o.n;
      if (i === 0) {
        if (Z[j] > 0) { ctx.moveTo(C + R * X[j], C - R * Y[j]); pv = true; } else pv = false;
        continue;
      }
      p = (i - 1) % o.n;
      if (o.brk && o.brk[p]) {
        if (Z[j] > 0) { ctx.moveTo(C + R * X[j], C - R * Y[j]); pv = true; } else pv = false;
        continue;
      }
      if (Z[j] > 0) {
        if (!pv) {
          t = Z[j] / (Z[j] - Z[p]);
          xi = X[j] + (X[p] - X[j]) * t; yi = Y[j] + (Y[p] - Y[j]) * t;
          l = Math.sqrt(xi * xi + yi * yi) || 1;
          ctx.moveTo(C + R * xi / l, C - R * yi / l);
        }
        ctx.lineTo(C + R * X[j], C - R * Y[j]);
        pv = true;
      } else {
        if (pv) {
          t = Z[p] / (Z[p] - Z[j]);
          xi = X[p] + (X[j] - X[p]) * t; yi = Y[p] + (Y[j] - Y[p]) * t;
          l = Math.sqrt(xi * xi + yi * yi) || 1;
          ctx.lineTo(C + R * xi / l, C - R * yi / l);
        }
        pv = false;
      }
    }
  }

  function project(lon, lat, out) {
    var cl = Math.cos(lat), sl = Math.sin(lat), dl = lon - rot, cd = Math.cos(dl);
    out.x = C + R * cl * Math.sin(dl);

    out.z = sph * sl + cph * cl * cd;

  }

  /* ---------- current flowing along the grid lines ---------- */
  function spawn() {
    var n = nodes[(Math.random() * nodes.length) | 0], e = n.adj[(Math.random() * n.adj.length) | 0];
    runners.push({ from: n, edge: e, prev: null, t: 0, v: rnd(8, 16), trail: [],
      max: (28 + Math.random() * 40) | 0, hops: 0, life: (6 + Math.random() * 10) | 0, dead: false });
  }
  function stepRunner(q, dt) {

      q.edge = opts[(Math.random() * opts.length) | 0];

    q.trail.push([q.from.lon + q.edge.dlon * q.t, q.from.lat + q.edge.dlat * q.t]);

  function drawRunner(q) {

      ctx.lineWidth = (0.7 + 2.0 * a) * s;

      g.addColorStop(0.3, 'rgba(110,210,255,0.45)');
      g.addColorStop(1, 'rgba(60,160,255,0)');

    }

  /* ---------- electric arcs ---------- */
  function bolt(a, b, disp) {
    var pts = [{ x: a.x, y: a.y }, { x: b.x, y: b.y }], k, i, np, p, q, nx, ny, nl, off;
    for (k = 0; k < 5; k++) {
      np = [pts[0]];
      for (i = 0; i < pts.length - 1; i++) {
        p = pts[i]; q = pts[i + 1];

        np.push(q);

  function makeArc(a, b, d, life) {
    var main = bolt(a, b, d * 0.30), paths = [main], i, p, ang, len;
    for (i = 0; i < 2; i++) {
      p = main[(main.length * (0.25 + Math.random() * 0.5)) | 0];
      ang = Math.atan2(b.y - a.y, b.x - a.x) + (Math.random() < 0.5 ? -1 : 1) * rnd(0.5, 1.0);
      len = d * rnd(0.2, 0.38);
      paths.push(bolt(p, { x: p.x + Math.cos(ang) * len, y: p.y + Math.sin(ang) * len }, len * 0.3));
    }

  }

    var vis = nodes.filter(function (n) { return n.z > 0.3; }), a, b, d, t = 0;
    if (vis.length < 2) return;
    do {
      a = vis[(Math.random() * vis.length) | 0];
      b = vis[(Math.random() * vis.length) | 0];

      t++;

  }
  function drawArc(arc) {
    var fade = 1 - arc.age / arc.life, f = fade * (0.55 + 0.45 * Math.random());
    var passes = [
      [7 * s, 'rgba(60,150,255,' + (0.11 * f).toFixed(3) + ')'],
      [2.6 * s, 'rgba(110,215,255,' + (0.38 * f).toFixed(3) + ')'],

  /* ---------- one frame ---------- */
  function draw(dt) {
    var i, n, g, rr, q, a;
    ctx.clearRect(0, 0, C * 2, C * 2);
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    for (i = 0; i < nodes.length; i++) {
      n = nodes[i];

    ctx.beginPath();
    for (i = 0; i < grat.length; i++) { spin(grat[i]); runs(grat[i]); }
    ctx.lineWidth = Math.max(1, 0.9 * s);
    ctx.strokeStyle = 'rgba(80,185,255,0.06)';
    ctx.stroke();

    // power grid across the land
    ctx.beginPath();
    for (i = 0; i < edges.length; i++) {

    }

    ctx.strokeStyle = 'rgba(90,195,255,0.15)';

    ctx.beginPath();
    for (i = 0; i < nodes.length; i++) {
      n = nodes[i];

    }

    ctx.fill();

    // coastlines
    ctx.beginPath();
    for (i = 0; i < coast.length; i++) { spin(coast[i]); runs(coast[i]); }
    [[8 * s, 'rgba(60,150,255,0.10)'], [3 * s, 'rgba(110,210,255,0.30)'], [1.1 * s, 'rgba(235,250,255,0.92)']].forEach(function (p) {
      ctx.lineWidth = p[0]; ctx.strokeStyle = p[1]; ctx.stroke();
    });

    for (i = 0; i < nodes.length; i++) {
      n = nodes[i];
      if (n.flash > 0.03 && n.z > 0.05) {
        rr = (5 + 11 * n.flash) * s;
        g = ctx.createRadialGradient(n.sx, n.sy, 0, n.sx, n.sy, rr);
        g.addColorStop(0, 'rgba(200,240,255,' + Math.min(0.7, 0.6 * n.flash).toFixed(3) + ')');
        g.addColorStop(1, 'rgba(60,160,255,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(n.sx, n.sy, rr, 0, TAU); ctx.fill();
      }
      if (n.flash > 0) n.flash *= Math.pow(0.93, dt / 16.667);
    }

    for (i = runners.length - 1; i >= 0; i--) {
      q = runners[i];
      if (dt) stepRunner(q, dt);
      if (q.dead && !q.trail.length) { runners.splice(i, 1); continue; }
      drawRunner(q);
    }
    for (i = arcs.length - 1; i >= 0; i--) {
      a = arcs[i];
      a.age += dt;
      if (a.age >= a.life) { arcs.splice(i, 1); continue; }
      drawArc(a);
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function frame(now) {
    var dt = last ? Math.min(64, now - last) : 16.7;
    last = now;
    rot -= SPEED * dt / 1000;
    var target = 14;
    if (runners.length < target && Math.random() < 0.10 * dt / 16.667) spawn();
    if (now > nextArc) { strike(); if (Math.random() < 0.3) strike(); nextArc = now + rnd(1800, 4200); }
    draw(dt);
    requestAnimationFrame(frame);
  }

  var timer;
  window.addEventListener('resize', function () { clearTimeout(timer); timer = setTimeout(build, 150); });
  window.addEventListener('pointermove', function (e) {
    var r = cv.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top, rad = 80 * s, i, n, dx, dy;
    for (i = 0; i < nodes.length; i++) {
      n = nodes[i];
      if (n.z <= 0.05) continue;
      dx = n.sx - px; dy = n.sy - py;
      if (dx * dx + dy * dy < rad * rad) n.flash = Math.max(n.flash, 0.7);
    }

  build();
  if (!reduce) requestAnimationFrame(frame);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(build);
})();
